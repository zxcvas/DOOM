<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linux Doom — WASM environment smoke test</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #0b0b0d; color: #e6e6e6;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  canvas {
    image-rendering: pixelated;
    width: 640px; height: 400px;           /* integer 2x of 320x200 */
    border: 1px solid #333; background: #000;
    box-shadow: 0 0 40px rgba(255,80,0,.15);
  }
  #status { min-height: 1.4em; }
  .ok { color: #6fdc6f; } .bad { color: #ff6b6b; } .muted { color: #888; }
  code { color: #ffb060; }
</style>
</head>
<body>
  <h1>Linux Doom &mdash; browser/WASM environment smoke test</h1>
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="status" class="muted">loading WASM module&hellip;</div>
  <div class="muted">
    Real engine sources <code>m_fixed.c</code> + <code>tables.c</code> +
    <code>m_random.c</code> compiled to WebAssembly by Emscripten.
  </div>

  <script type="module">
    import createDoomSmoke from "./dist/doom_smoke.js";

    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d");

    try {
      const M = await createDoomSmoke();

      const selftest = M.cwrap("selftest", "number", []);
      const initPalette = M.cwrap("init_palette", null, []);
      const renderFrame = M.cwrap("render_frame", null, ["number"]);
      const getFb = M.cwrap("get_framebuffer", "number", []);
      const getPal = M.cwrap("get_palette", "number", []);
      const fbW = M.cwrap("framebuffer_width", "number", []);
      const fbH = M.cwrap("framebuffer_height", "number", []);

      const passed = selftest() === 1;
      initPalette();

      const W = fbW(), H = fbH();
      const image = ctx.createImageData(W, H);

      statusEl.innerHTML = passed
        ? `self-test <span class="ok">PASSED</span> &mdash; real Doom fixed-point / trig / RNG verified in WASM`
        : `self-test <span class="bad">FAILED</span>`;

      let tic = 0;
      function frame() {
        renderFrame(tic++);

        const fbPtr = getFb();
        const palPtr = getPal();
        const fb = M.HEAPU8.subarray(fbPtr, fbPtr + W * H);
        const pal = M.HEAPU8.subarray(palPtr, palPtr + 256 * 3);
        const out = image.data;

        // Palette expand: 8-bit index -> RGBA, exactly the documented model
        // (indices produced on the CPU, RGB expansion in the presenter).
        for (let i = 0; i < W * H; i++) {
          const idx = fb[i] * 3;
          const o = i * 4;
          out[o]     = pal[idx];
          out[o + 1] = pal[idx + 1];
          out[o + 2] = pal[idx + 2];
          out[o + 3] = 255;
        }
        ctx.putImageData(image, 0, 0);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Expose a signal for automated verification.
      window.__SMOKE_OK__ = passed;
    } catch (err) {
      statusEl.innerHTML = `<span class="bad">error:</span> ${err}`;
      window.__SMOKE_OK__ = false;
      throw err;
    }
  </script>
</body>
</html>
